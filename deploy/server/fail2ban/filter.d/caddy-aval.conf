# fail2ban filter for the Aval Caddy access log (JSON), ADR-030.
# Bans client IPs that pile up failed/blocked auth attempts (HTTP 401 or 429) on the auth routes.
# The Caddy log records the resolved real client IP in "client_ip" (trusted_proxies is set), so
# the ban targets the real attacker even behind the Tailscale Funnel.
[Definition]
failregex = "client_ip":"<HOST>",.*"uri":"/api/v1/auth/(login|password-reset/[^"]*|email-verification/[^"]*)".*"status":(401|429)
# Caddy JSON logs the time as an epoch float in "ts". If fail2ban cannot detect the date,
# uncomment and adjust the line below.
# datepattern = "ts":%s\.%f
ignoreregex =
