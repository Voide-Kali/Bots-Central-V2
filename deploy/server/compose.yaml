# Bots Central V2 — home server stack (Ubuntu + Docker + Tailscale).
# Nothing is published to the internet: Caddy binds only to the Tailscale IP and
# obtains its *.ts.net certificate from the local tailscaled.
# Usage (from this folder):  docker compose --env-file .env up -d --build

name: bots-central

# Privileged env (ADR-032): the OWNER/superuser role (POSTGRES_USER). Used ONLY by `migration`,
# which needs DDL. The app services do NOT use this — see x-app-env.
x-owner-env: &owner_env
  env_file: .env
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    PUBLIC_ORIGIN: https://${SERVER_HOSTNAME}
    TRUSTED_PROXY_IP: 172.30.10.10
    EMAIL_VERIFICATION_DELIVERY_MODE: smtp

# Least-privilege env (ADR-032): the application role (APP_DB_USER). Only DML, owns nothing, cannot
# run DDL nor touch the append-only audit trigger. Used by `backend` and `telegram`. Create the role
# once with deploy/server/setup-app-role.sh (idempotent) before bringing these up.
x-app-env: &app_env
  env_file: .env
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    PUBLIC_ORIGIN: https://${SERVER_HOSTNAME}
    TRUSTED_PROXY_IP: 172.30.10.10
    EMAIL_VERIFICATION_DELIVERY_MODE: smtp
    # ADR-035: `env_file: .env` acima despeja o .env INTEIRO no container, inclusive a senha do
    # dono/superusuario do banco (POSTGRES_PASSWORD). O app nao precisa dela — conecta como o papel
    # restrito pela DATABASE_URL. `environment` vence o `env_file`, entao esvaziamos a credencial do
    # dono: ela deixa de ter valor no ambiente de backend/telegram, preservando o ADR-032 mesmo se um
    # desses containers for comprometido.
    POSTGRES_PASSWORD: ""
    POSTGRES_USER: ""

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]

  migration:
    build: ../../backend
    image: bots-central-backend:local
    command: ["alembic", "upgrade", "head"]
    <<: *owner_env   # migrations need DDL -> owner/superuser role
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  backend:
    build: ../../backend
    image: bots-central-backend:local
    restart: unless-stopped
    <<: *app_env   # least-privilege app role (ADR-032)
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      internal:
        ipv4_address: 172.30.10.20
      egress: {}  # SMTP to the system mailbox

  telegram:
    build: ../../backend
    image: bots-central-backend:local
    restart: unless-stopped
    command: ["python", "-m", "app.telegram.bot"]
    env_file: .env
    environment:
      APP_ENV: production
      # Least-privilege app role (ADR-032), same as backend — not the Postgres superuser.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_ORIGIN: https://${SERVER_HOSTNAME}
      TRUSTED_PROXY_IP: 172.30.10.10
      EMAIL_VERIFICATION_DELIVERY_MODE: smtp
      ASSISTANT_OLLAMA_URL: http://ollama:11434
      # ADR-035: esvazia a senha do dono do banco herdada do `env_file: .env` (ver backend/x-app-env).
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: ""
    depends_on:
      migration:
        condition: service_completed_successfully
    networks: [internal, egress]

  ollama:
    # Local LLM for the read-only assistant (ADR-013). Not published; reachable only
    # from containers. Pull the model once:
    #   docker compose exec ollama ollama pull qwen2.5:3b
    # Pinned to a fixed release instead of "latest" for reproducible, non-drifting
    # builds (revisao de seguranca M1). For tamper-evidence, pin the digest too: on a
    # host with registry access run
    #   docker buildx imagetools inspect ollama/ollama:0.40.8
    # and set OLLAMA_IMAGE=ollama/ollama:0.40.8@sha256:<digest> in .env.
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.8}
    restart: unless-stopped
    environment:
      # Keep the model loaded between questions so an occasional question does not pay the
      # cold reload from disk (the slowest part on a CPU-only server).
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama-data:/root/.ollama
    networks: [internal, egress]

  web:
    build:
      context: ../../frontend
      dockerfile: ../deploy/server/web.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_HOSTNAME: ${SERVER_HOSTNAME}
    ports:
      # The web container serves ONLY plain HTTP on the host loopback (ADR-031). Tailscale
      # `serve`/`funnel` owns :443 on the tailnet address and does the TLS, forwarding BOTH tailnet
      # and public traffic here. The web no longer binds the tailnet :443/:80 — that collided with
      # the Funnel (both wanted :443) and broke the whole stack. Bring the entrance up with:
      #   sudo tailscale funnel --bg --https=443 http://127.0.0.1:8082
      - "127.0.0.1:8082:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Download site (ADR-026), generated by deploy/release/build-downloads.sh. Read-only.
      - ./downloads:/srv/site:ro
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      - caddy-data:/data
      # Access log for optional fail2ban (ADR-030). Host dir, created by Docker on first run.
      - ./logs:/var/log/caddy
    depends_on: [backend]
    networks:
      internal:
        ipv4_address: 172.30.10.10
      egress: {}

  downloads:
    # Download-only static server (ADR-027). Serves ONLY the /baixar page and installers; no API.
    # Bound to 127.0.0.1 so only the host reaches it; exposed publicly for just /baixar via
    # Tailscale Funnel (see ADR-027). Panel and API stay private on the tailnet.
    # On its OWN bridge network (not egress): a normal bridge publishes the host port, while
    # keeping this container off the network that backend/telegram/ollama share, so a compromise
    # of this static server cannot reach the API or the unauthenticated ollama (least privilege,
    # restores the ADR-027 isolation claim). It needs no outbound: it only serves local files.
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./downloads.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/baixar:ro
    ports:
      - "127.0.0.1:8081:80"
    networks: [downloads_net]

  backup:
    # Postgres client tools + age (ADR-033): cada dump e cifrado antes de tocar o disco.
    build:
      context: .
      dockerfile: backup.Dockerfile
    image: bots-central-backup:local
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Chave publica age (age1...). A privada fica FORA do servidor (ADR-033).
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT}
    volumes:
      - ${BACKUP_DIR}:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    internal: true
    driver_opts:
      com.docker.network.driver.mtu: "1400"
    ipam:
      config:
        - subnet: 172.30.10.0/24
  egress:
    driver_opts:
      com.docker.network.driver.mtu: "1400"
  # Dedicated bridge for the download-only server: publishes its host port without putting it on
  # the network the backend/telegram/ollama share (ADR-027 isolation).
  downloads_net:
    driver_opts:
      com.docker.network.driver.mtu: "1400"

volumes:
  postgres-data:
  caddy-data:
  ollama-data:
