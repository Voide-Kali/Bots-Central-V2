name: Dependency audit

# Runs weekly so a new advisory against a pinned dependency shows up even when
# nobody pushes. CI already audits the backend on every push; this also covers
# both backend locks, the agent and the frontend.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - run: grep -v '^-e ' requirements.lock > "$RUNNER_TEMP/requirements.lock"
      - run: pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.lock"
      - run: pip-audit --no-deps --disable-pip -r requirements.runtime.lock

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --package-lock-only --audit-level=high
