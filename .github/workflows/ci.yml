name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: bots_central_test
          POSTGRES_USER: bots_central_test
          POSTGRES_PASSWORD: test-only-not-a-secret
        options: >-
          --health-cmd "pg_isready -U bots_central_test -d bots_central_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: ruff check .
      - run: mypy app tests
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bots_central_test:test-only-not-a-secret@localhost:5432/bots_central_test
      - run: pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
